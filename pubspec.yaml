name: flutter_quill
description: "A rich text editor built for Android, iOS, Web, and desktop platforms. It's the WYSIWYG editor and a Quill component for Flutter."
version: 11.6.0
homepage: https://github.com/Sebastien-VZN/flutter_quill_robust
repository: https://github.com/Sebastien-VZN/flutter_quill_robust
issue_tracker: https://github.com/Sebastien-VZN/flutter_quill_robust/issues
publish_to: none

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  dart_quill_delta:
    git:
      url: https://github.com/Sebastien-VZN/dart_quill_delta_robust.git
  collection: ^1.17.0
  quiver: ^3.2.0
  meta: ^1.7.0
  html: ^0.15.0
  intl: '>=0.19.0 <0.21.0'

  flutter_colorpicker: ^1.1.0

  # Emoji picker overlay for the desktop toolbar button
  emoji_picker_flutter: ^4.5.3

  # For converting HTML to Quill delta
  markdown: ^7.1.0
  charcode: ^1.3.0

  # Plugins
  url_launcher: ^6.2.1
  flutter_keyboard_visibility_temp_fork: ^0.1.1

  # Native bridge — fork git
  quill_native_bridge:
    git:
      url: https://github.com/Sebastien-VZN/quill_native_bridge_robust.git
      path: quill_native_bridge

dev_dependencies:
  very_good_analysis: ^10.2.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  test: ^1.24.3

  # For scripts only
  yaml_edit: ^2.2.1
  yaml: ^3.1.2
  http: ^1.2.1

  path: any

flutter:
  uses-material-design: true
  generate: true