name: flutter_quill_extensions
description: Extensions for flutter_quill — text-only, no media embeds.
version: 11.0.2+2
homepage: https://github.com/Sebastien-VZN/flutter_quill_robust
repository: https://github.com/Sebastien-VZN/flutter_quill_robust
issue_tracker: https://github.com/Sebastien-VZN/flutter_quill_robust/issues
publish_to: none

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.7.0

  flutter_quill:
    path: ../
  web: ^1.1.1

dev_dependencies:
  very_good_analysis: ^10.2.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true